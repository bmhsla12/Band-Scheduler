<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#1c1b19;
    --panel:#232120;
    --panel-2:#2b2926;
    --line:#3a3733;
    --text:#f2ede4;
    --text-dim:#a49d92;
    --amber:#e8a33d;
    --amber-dim:#5c4620;
    --radius:10px;
  }

  #bs-root{
    font-family:'Space Grotesk',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:0;
    box-sizing:border-box;
    -webkit-font-smoothing:antialiased;
  }
  #bs-root *{box-sizing:border-box;}
  #bs-root .mono{font-family:'JetBrains Mono',monospace;}

  .bs-header{ padding:28px 24px 16px; border-bottom:1px solid var(--line); }
  .bs-header h1{ margin:0; font-size:22px; font-weight:700; letter-spacing:-0.01em; }
  .bs-header p{ margin:6px 0 0; color:var(--text-dim); font-size:13px; }

  .bs-tabs{
    display:flex; gap:2px; padding:0 24px;
    border-bottom:1px solid var(--line);
    background:var(--panel);
    overflow-x:auto;
  }
  .bs-tab{
    padding:13px 16px;
    font-family:'Space Grotesk',sans-serif;
    font-size:13.5px; font-weight:600;
    color:var(--text-dim); background:none; border:none;
    border-bottom:2px solid transparent;
    cursor:pointer; white-space:nowrap;
  }
  .bs-tab.active{ color:var(--amber); border-bottom:2px solid var(--amber); }
  .bs-tab:hover:not(.active){ color:var(--text); }

  .bs-body{ padding:22px 24px 60px; max-width:980px; margin:0 auto; }

  .bs-card{
    background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); padding:18px; margin-bottom:16px;
  }
  .bs-card h3{ margin:0 0 4px; font-size:14px; font-weight:600; }
  .bs-card .bs-sub{ color:var(--text-dim); font-size:12px; margin:0 0 14px; }

  .bs-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

  .bs-input, .bs-select{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:9px 11px;
    font-family:'Space Grotesk',sans-serif; font-size:13px; outline:none;
  }
  .bs-input:focus, .bs-select:focus{ border-color:var(--amber); }
  .bs-input{ flex:1; min-width:140px; }

  .bs-btn{
    background:var(--amber); color:#211a0d; border:none; border-radius:6px;
    padding:9px 16px; font-family:'Space Grotesk',sans-serif;
    font-size:13px; font-weight:700; cursor:pointer;
  }
  .bs-btn:hover{ filter:brightness(1.08); }
  .bs-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .bs-btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--text-dim); }
  .bs-btn-ghost:hover{ color:var(--text); border-color:var(--text-dim); }

  .bs-chip-x{
    background:none; border:none; color:inherit; opacity:0.55; cursor:pointer;
    font-size:14px; line-height:1; padding:0 0 0 4px;
  }
  .bs-chip-x:hover{ opacity:1; }

  .bs-session-group{ margin-bottom:14px; }
  .bs-session-label{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text-dim); margin-bottom:7px; font-weight:600; }
  .bs-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .bs-member-list{ display:flex; flex-wrap:wrap; gap:6px; }
  .bs-member-pill{ display:flex; align-items:center; padding:5px 6px 5px 10px; border-radius:20px; font-size:12.5px; font-weight:500; border:1px solid var(--line); }

  .bs-song-card{
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding:12px 14px; margin-bottom:8px;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .bs-song-title{ font-weight:600; font-size:14px; }
  .bs-req-badges{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .bs-req-badge{ font-family:'JetBrains Mono',monospace; font-size:11px; padding:2px 7px; border-radius:4px; color:#1a1a1a; font-weight:600; }

  .bs-req-inputs{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin:12px 0; }
  .bs-req-input-item{
    display:flex; flex-direction:column; align-items:flex-start; gap:8px;
    padding:10px 12px; background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
  }
  .bs-req-input-item .bs-req-label-row{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text-dim); white-space:nowrap; }
  .bs-req-input-item input{ width:100%; }

  .bs-grid-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:8px; }
  table.bs-grid{ border-collapse:collapse; width:100%; min-width:640px; }
  table.bs-grid th, table.bs-grid td{ border:1px solid var(--line); text-align:center; padding:0; }
  table.bs-grid th{ background:var(--panel-2); font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--text-dim); font-weight:500; padding:8px 4px; }
  table.bs-grid td.bs-hourcell{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); background:var(--panel-2); padding:0 8px; white-space:nowrap; }
  .bs-slot{ width:100%; height:30px; cursor:pointer; background:var(--panel); transition:background 0.08s; position:relative; touch-action:none; user-select:none; -webkit-user-select:none; }
  .bs-slot:hover{ filter:brightness(1.3); }
  .bs-slot.editable{ cursor:pointer; }

  .bs-legend{ display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; font-size:12px; color:var(--text-dim); }
  .bs-legend-item{ display:flex; align-items:center; gap:6px; }
  .bs-legend-swatch{ width:14px; height:14px; border-radius:3px; }

  .bs-empty{ color:var(--text-dim); font-size:13px; padding:14px 0; }
  .bs-toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--amber); color:#211a0d; padding:8px 16px;
    border-radius:20px; font-size:12.5px; font-weight:700;
    opacity:0; transition:opacity 0.25s; pointer-events:none; z-index:50;
  }
  .bs-toast.show{ opacity:1; }

  .bs-popover{
    position:fixed;
    display:none;
    z-index:200;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    font-size:12.5px;
    line-height:1.5;
    max-width:230px;
    box-shadow:0 10px 28px rgba(0,0,0,0.45);
    pointer-events:none;
  }
  .bs-popover-title{ font-weight:700; color:var(--text); margin-bottom:5px; font-family:'JetBrains Mono',monospace; font-size:12px; }
  .bs-popover-line{ color:var(--text-dim); margin-top:5px; }
  .bs-popover-line strong{ color:var(--amber); display:block; font-size:11px; margin-bottom:2px; }
  .bs-count-badge{ font-family:'JetBrains Mono',monospace; font-size:9px; display:block; line-height:1.3; }
  .bs-song-select-bar{ display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }

  @media (max-width:640px){
    .bs-header{ padding:20px 16px 14px; }
    .bs-tabs{ padding:0 16px; }
    .bs-body{ padding:18px 16px 60px; }
  }
</style>

<div id="bs-root">
  <div class="bs-header">
    <h1>합주 시간표</h1>
    <p>세션별 가능 시간을 겹쳐 보고, 곡마다 합주 가능한 시간대를 찾아요</p>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import {
    getFirestore, doc, getDoc, setDoc, deleteDoc,
    collection, getDocs, query, where, documentId
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDB1nnYEKvEjYSIqx7pSO1aG55lsr7j-t0",
    authDomain: "band-schedule-5cc9f.firebaseapp.com",
    projectId: "band-schedule-5cc9f",
    storageBucket: "band-schedule-5cc9f.firebasestorage.app",
    messagingSenderId: "1060893456298",
    appId: "1:1060893456298:web:3fbda3b097b9babf96ddd3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const COLLECTION = 'bandScheduler'; // Firestore에 데이터가 저장될 컬렉션 이름

  // 아래 앱 코드는 원래 Claude 아티팩트의 window.storage API를 그대로 호출하도록
  // 작성돼 있어서, 같은 이름/형태의 함수를 Firestore로 구현해 대체합니다.
  // (원래 API의 shared 인자는 이 사이트에서는 항상 공유 데이터이므로 무시합니다.)
  window.storage = {
    async get(key){
      const snap = await getDoc(doc(db, COLLECTION, key));
      if (!snap.exists()) throw new Error('not found: ' + key);
      return { key: key, value: snap.data().value, shared: true };
    },
    async set(key, value){
      await setDoc(doc(db, COLLECTION, key), { value: value });
      return { key: key, value: value, shared: true };
    },
    async delete(key){
      await deleteDoc(doc(db, COLLECTION, key));
      return { key: key, deleted: true, shared: true };
    },
    async list(prefix){
      prefix = prefix || '';
      const q = query(
        collection(db, COLLECTION),
        where(documentId(), '>=', prefix),
        where(documentId(), '<', prefix + '\uf8ff')
      );
      const snaps = await getDocs(q);
      const keys = [];
      snaps.forEach(function(d){ keys.push(d.id); });
      return { keys: keys, prefix: prefix, shared: true };
    }
  };
</script>

<script type="module">
(function(){
  const SESSIONS = [
    {key:'남보컬', hex:'#e8546b'},
    {key:'여보컬', hex:'#c77dff'},
    {key:'일렉기타', hex:'#4fc3f7'},
    {key:'베이스', hex:'#66bb6a'},
    {key:'드럼', hex:'#ffb74d'},
  ];
  const SESSION_HEX = {};
  SESSIONS.forEach(function(s){ SESSION_HEX[s.key] = s.hex; });
  const DAYS = ['월','화','수','목','금','토','일'];
  const HOURS = [];
  for(let h=9; h<24; h++) HOURS.push(h);

  let state = {
    tab: 'members',
    members: [],
    songs: [],
    availability: {},   // memberId -> array of "day_hour" strings
    currentMemberId: null,
    currentSongId: null,
    loading: true,
  };

  function slotId(day, hour){ return day + '_' + hour; }
  function hexToRgba(hex, a){
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function showToast(msg){
    const t = document.getElementById('bs-toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1400);
  }

  // ---- Drag-to-select for the schedule grid (mouse drag on desktop, touch drag on mobile) ----
  // dragCtx.apply/end are reassigned each time the "my schedule" tab renders,
  // so there's only ever one set of document-level listeners.
  const dragCtx = { active:false, mode:null, apply:null, end:null };
  document.addEventListener('pointermove', function(e){
    if (!dragCtx.active) return;
    e.preventDefault();
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if (!el) return;
    const slotEl = el.closest ? el.closest('.bs-slot') : null;
    if (!slotEl || !slotEl.dataset.id) return;
    if (dragCtx.apply) dragCtx.apply(slotEl.dataset.id, slotEl);
  }, { passive:false });
  document.addEventListener('pointerup', function(){
    if (!dragCtx.active) return;
    dragCtx.active = false;
    if (dragCtx.end) dragCtx.end();
  });
  document.addEventListener('pointercancel', function(){
    dragCtx.active = false;
  });

  // ---- Hover / tap popover for the overlay grid ----
  const popoverCtx = { openId:null };
  function hidePopover(){
    const pop = document.getElementById('bs-popover');
    if (pop) pop.style.display = 'none';
    popoverCtx.openId = null;
  }
  function positionPopover(pop, rect){
    const margin = 10;
    pop.style.visibility = 'hidden';
    pop.style.display = 'block';
    const popW = pop.offsetWidth;
    const popH = pop.offsetHeight;
    let left = rect.right + margin;
    let top = rect.top;
    if (left + popW > window.innerWidth - 8) left = rect.left - popW - margin;
    if (left < 8) left = 8;
    if (top + popH > window.innerHeight - 8) top = window.innerHeight - popH - 8;
    if (top < 8) top = 8;
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
    pop.style.visibility = 'visible';
  }
  function showPopoverForSlot(slotEl, day, hour, availableMembers, possibleSongs){
    const pop = document.getElementById('bs-popover');
    if (!pop) return;
    const timeLabel = day + '요일 ' + String(hour).padStart(2,'0') + ':00';
    let html = '<div class="bs-popover-title">' + timeLabel + '</div>';
    if (availableMembers.length){
      html += '<div class="bs-popover-line"><strong>가능 인원</strong>' +
        availableMembers.map(function(m){ return m.name + '(' + m.session + ')'; }).join(', ') + '</div>';
    } else {
      html += '<div class="bs-popover-line">가능한 인원이 없어요</div>';
    }
    if (possibleSongs.length){
      html += '<div class="bs-popover-line"><strong>합주 가능한 곡</strong>' +
        possibleSongs.map(function(s){ return s.title; }).join(', ') + '</div>';
    } else {
      html += '<div class="bs-popover-line">합주 가능한 곡 없음</div>';
    }
    pop.innerHTML = html;
    positionPopover(pop, slotEl.getBoundingClientRect());
  }
  document.addEventListener('click', function(){ hidePopover(); });
  document.addEventListener('scroll', function(){ hidePopover(); }, true);

  async function loadAll(){
    state.loading = true;
    render();
    try {
      const m = await window.storage.get('members', true).catch(function(){ return null; });
      state.members = m ? JSON.parse(m.value) : [];
    } catch(e){ state.members = []; }
    try {
      const s = await window.storage.get('songs', true).catch(function(){ return null; });
      state.songs = s ? JSON.parse(s.value) : [];
    } catch(e){ state.songs = []; }

    state.availability = {};
    try {
      const list = await window.storage.list('avail:', true).catch(function(){ return null; });
      const keys = (list && list.keys) ? list.keys : [];
      for (const k of keys){
        try {
          const r = await window.storage.get(k, true);
          const memberId = k.slice('avail:'.length);
          state.availability[memberId] = r ? JSON.parse(r.value) : [];
        } catch(e){}
      }
    } catch(e){}

    if (state.members.length && !state.currentMemberId){
      state.currentMemberId = state.members[0].id;
    }
    if (state.songs.length && !state.currentSongId){
      state.currentSongId = state.songs[0].id;
    }
    state.loading = false;
    render();
  }

  async function saveMembers(){
    await window.storage.set('members', JSON.stringify(state.members), true);
  }
  async function saveSongs(){
    await window.storage.set('songs', JSON.stringify(state.songs), true);
  }
  async function saveAvailability(memberId){
    const arr = state.availability[memberId] || [];
    await window.storage.set('avail:' + memberId, JSON.stringify(arr), true);
  }

  // ---------- Rendering ----------

  function render(){
    renderTabs();
    renderBody();
  }

  function renderTabs(){
    const tabs = [
      {key:'members', label:'부원'},
      {key:'songs', label:'곡'},
      {key:'myschedule', label:'내 시간표'},
      {key:'overlay', label:'합주 가능 시간'},
    ];
    const el = document.getElementById('bs-tabs');
    el.innerHTML = '';
    tabs.forEach(function(t){
      const btn = document.createElement('button');
      btn.className = 'bs-tab' + (state.tab === t.key ? ' active' : '');
      btn.textContent = t.label;
      btn.onclick = function(){ state.tab = t.key; render(); };
      el.appendChild(btn);
    });
  }

  function renderBody(){
    const body = document.getElementById('bs-body');
    if (state.loading){
      body.innerHTML = '<div class="bs-empty">불러오는 중...</div>';
      return;
    }
    body.innerHTML = '';
    if (state.tab === 'members') body.appendChild(renderMembersTab());
    else if (state.tab === 'songs') body.appendChild(renderSongsTab());
    else if (state.tab === 'myschedule') body.appendChild(renderMyScheduleTab());
    else if (state.tab === 'overlay') body.appendChild(renderOverlayTab());
  }

  // ---- Members tab ----
  function renderMembersTab(){
    const wrap = document.createElement('div');

    const formCard = document.createElement('div');
    formCard.className = 'bs-card';
    formCard.innerHTML = '<h3>부원 추가</h3><p class="bs-sub">이름과 담당 세션을 입력하세요</p>';

    const row = document.createElement('div');
    row.className = 'bs-row';

    const nameInput = document.createElement('input');
    nameInput.className = 'bs-input';
    nameInput.placeholder = '이름';

    const sessionSelect = document.createElement('select');
    sessionSelect.className = 'bs-select';
    SESSIONS.forEach(function(s){
      const opt = document.createElement('option');
      opt.value = s.key; opt.textContent = s.key;
      sessionSelect.appendChild(opt);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'bs-btn';
    addBtn.textContent = '추가';
    addBtn.onclick = async function(){
      const name = nameInput.value.trim();
      if (!name) return;
      state.members.push({ id: uid(), name: name, session: sessionSelect.value });
      nameInput.value = '';
      await saveMembers();
      showToast('부원을 추가했어요');
      render();
    };
    nameInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') addBtn.click(); });

    row.appendChild(nameInput);
    row.appendChild(sessionSelect);
    row.appendChild(addBtn);
    formCard.appendChild(row);
    wrap.appendChild(formCard);

    const listCard = document.createElement('div');
    listCard.className = 'bs-card';
    listCard.innerHTML = '<h3>부원 목록</h3>';

    if (!state.members.length){
      const empty = document.createElement('div');
      empty.className = 'bs-empty';
      empty.textContent = '아직 등록된 부원이 없어요.';
      listCard.appendChild(empty);
    } else {
      SESSIONS.forEach(function(s){
        const members = state.members.filter(function(m){ return m.session === s.key; });
        if (!members.length) return;
        const group = document.createElement('div');
        group.className = 'bs-session-group';
        const label = document.createElement('div');
        label.className = 'bs-session-label';
        label.innerHTML = '<span class="bs-dot" style="background:' + s.hex + '"></span>' + s.key + ' (' + members.length + ')';
        group.appendChild(label);
        const listDiv = document.createElement('div');
        listDiv.className = 'bs-member-list';
        members.forEach(function(m){
          const pill = document.createElement('div');
          pill.className = 'bs-member-pill';
          pill.style.background = hexToRgba(s.hex, 0.16);
          pill.style.color = s.hex;
          pill.innerHTML = '<span>' + m.name + '</span>';
          const xBtn = document.createElement('button');
          xBtn.className = 'bs-chip-x';
          xBtn.textContent = '×';
          xBtn.onclick = async function(){
            state.members = state.members.filter(function(x){ return x.id !== m.id; });
            delete state.availability[m.id];
            if (state.currentMemberId === m.id) state.currentMemberId = state.members.length ? state.members[0].id : null;
            await saveMembers();
            render();
          };
          pill.appendChild(xBtn);
          listDiv.appendChild(pill);
        });
        group.appendChild(listDiv);
        listCard.appendChild(group);
      });
    }
    wrap.appendChild(listCard);
    return wrap;
  }

  // ---- Songs tab ----
  function renderSongsTab(){
    const wrap = document.createElement('div');

    const formCard = document.createElement('div');
    formCard.className = 'bs-card';
    formCard.innerHTML = '<h3>곡 추가</h3><p class="bs-sub">곡 제목과 세션별 필요 인원 수를 입력하세요</p>';

    const titleInput = document.createElement('input');
    titleInput.className = 'bs-input';
    titleInput.placeholder = '곡 제목';
    titleInput.style.width = '100%';
    formCard.appendChild(titleInput);

    const reqGrid = document.createElement('div');
    reqGrid.className = 'bs-req-inputs';
    const reqInputs = {};
    SESSIONS.forEach(function(s){
      const item = document.createElement('div');
      item.className = 'bs-req-input-item';
      const labelRow = document.createElement('div');
      labelRow.className = 'bs-req-label-row';
      const dot = document.createElement('span');
      dot.className = 'bs-dot';
      dot.style.background = s.hex;
      const lbl = document.createElement('span');
      lbl.textContent = s.key;
      labelRow.appendChild(dot);
      labelRow.appendChild(lbl);
      const num = document.createElement('input');
      num.type = 'number'; num.min = '0'; num.value = '0';
      num.className = 'bs-input';
      reqInputs[s.key] = num;
      item.appendChild(labelRow);
      item.appendChild(num);
      reqGrid.appendChild(item);
    });
    formCard.appendChild(reqGrid);

    const addBtn = document.createElement('button');
    addBtn.className = 'bs-btn';
    addBtn.textContent = '곡 추가';
    addBtn.onclick = async function(){
      const title = titleInput.value.trim();
      if (!title) return;
      const req = {};
      SESSIONS.forEach(function(s){
        const v = parseInt(reqInputs[s.key].value, 10);
        if (v > 0) req[s.key] = v;
      });
      if (!Object.keys(req).length) { showToast('세션별 필요 인원을 1명 이상 입력하세요'); return; }
      state.songs.push({ id: uid(), title: title, req: req });
      titleInput.value = '';
      SESSIONS.forEach(function(s){ reqInputs[s.key].value = '0'; });
      await saveSongs();
      showToast('곡을 추가했어요');
      render();
    };
    formCard.appendChild(addBtn);
    wrap.appendChild(formCard);

    const listCard = document.createElement('div');
    listCard.className = 'bs-card';
    listCard.innerHTML = '<h3>곡 목록</h3>';
    if (!state.songs.length){
      const empty = document.createElement('div');
      empty.className = 'bs-empty';
      empty.textContent = '아직 등록된 곡이 없어요.';
      listCard.appendChild(empty);
    } else {
      state.songs.forEach(function(song){
        const card = document.createElement('div');
        card.className = 'bs-song-card';
        const left = document.createElement('div');
        const titleEl = document.createElement('div');
        titleEl.className = 'bs-song-title';
        titleEl.textContent = song.title;
        left.appendChild(titleEl);
        const badges = document.createElement('div');
        badges.className = 'bs-req-badges';
        Object.keys(song.req).forEach(function(sess){
          const b = document.createElement('span');
          b.className = 'bs-req-badge';
          b.style.background = SESSION_HEX[sess];
          b.textContent = sess + ' ' + song.req[sess];
          badges.appendChild(b);
        });
        left.appendChild(badges);
        card.appendChild(left);
        const delBtn = document.createElement('button');
        delBtn.className = 'bs-btn-ghost bs-btn';
        delBtn.textContent = '삭제';
        delBtn.onclick = async function(){
          state.songs = state.songs.filter(function(x){ return x.id !== song.id; });
          if (state.currentSongId === song.id) state.currentSongId = state.songs.length ? state.songs[0].id : null;
          await saveSongs();
          render();
        };
        card.appendChild(delBtn);
        listCard.appendChild(card);
      });
    }
    wrap.appendChild(listCard);
    return wrap;
  }

  // ---- My schedule tab ----
  function renderMyScheduleTab(){
    const wrap = document.createElement('div');
    if (!state.members.length){
      const empty = document.createElement('div');
      empty.className = 'bs-card bs-empty';
      empty.textContent = '먼저 "부원" 탭에서 본인을 등록해주세요.';
      wrap.appendChild(empty);
      return wrap;
    }

    const card = document.createElement('div');
    card.className = 'bs-card';
    const bar = document.createElement('div');
    bar.className = 'bs-song-select-bar';
    const label = document.createElement('span');
    label.textContent = '나는:';
    label.style.color = 'var(--text-dim)';
    label.style.fontSize = '13px';
    const select = document.createElement('select');
    select.className = 'bs-select';
    state.members.forEach(function(m){
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = m.name + ' (' + m.session + ')';
      if (m.id === state.currentMemberId) opt.selected = true;
      select.appendChild(opt);
    });
    select.onchange = function(){ state.currentMemberId = select.value; render(); };
    bar.appendChild(label);
    bar.appendChild(select);
    card.appendChild(bar);

    const sub = document.createElement('p');
    sub.className = 'bs-sub';
    sub.textContent = '가능한 시간대를 클릭하거나, 눌러서 끌면(드래그) 여러 칸을 한 번에 켤 수 있어요.';
    card.appendChild(sub);

    const member = state.members.find(function(m){ return m.id === state.currentMemberId; });
    const myColor = member ? SESSION_HEX[member.session] : '#e8a33d';
    const memberIdAtRender = state.currentMemberId;

    function isOn(id){
      const arr = state.availability[memberIdAtRender] || [];
      return arr.indexOf(id) !== -1;
    }
    function setSlotState(id, on){
      const arr = (state.availability[memberIdAtRender] || []).slice();
      const idx = arr.indexOf(id);
      if (on && idx === -1) arr.push(id);
      if (!on && idx !== -1) arr.splice(idx, 1);
      state.availability[memberIdAtRender] = arr;
    }

    const gridWrap = buildGridTable(function(day, hour, td){
      const id = slotId(day, hour);
      const slot = document.createElement('div');
      slot.className = 'bs-slot editable';
      slot.dataset.id = id;
      if (isOn(id)) slot.style.background = myColor;

      slot.addEventListener('pointerdown', function(e){
        e.preventDefault();
        const turnOn = !isOn(id);
        dragCtx.active = true;
        dragCtx.mode = turnOn;
        dragCtx.apply = function(applyId, applyEl){
          setSlotState(applyId, dragCtx.mode);
          applyEl.style.background = dragCtx.mode ? myColor : '';
        };
        dragCtx.end = function(){
          saveAvailability(memberIdAtRender).catch(function(){
            showToast('저장에 실패했어요. 다시 시도해주세요');
            renderBody();
          });
        };
        dragCtx.apply(id, slot);
      });

      td.appendChild(slot);
    });
    card.appendChild(gridWrap);
    wrap.appendChild(card);
    return wrap;
  }

  // ---- Overlay tab ----
  function renderOverlayTab(){
    const wrap = document.createElement('div');
    if (!state.members.length){
      const empty = document.createElement('div');
      empty.className = 'bs-card bs-empty';
      empty.textContent = '부원이 등록되면 이곳에서 겹쳐보기를 할 수 있어요.';
      wrap.appendChild(empty);
      return wrap;
    }

    const card = document.createElement('div');
    card.className = 'bs-card';

    const bar = document.createElement('div');
    bar.className = 'bs-song-select-bar';
    const label = document.createElement('span');
    label.textContent = '곡:';
    label.style.color = 'var(--text-dim)';
    label.style.fontSize = '13px';
    const select = document.createElement('select');
    select.className = 'bs-select';
    const noneOpt = document.createElement('option');
    noneOpt.value = '';
    noneOpt.textContent = '전체 인원 히트맵 (곡 미선택)';
    select.appendChild(noneOpt);
    state.songs.forEach(function(s){
      const opt = document.createElement('option');
      opt.value = s.id; opt.textContent = s.title;
      if (s.id === state.currentSongId) opt.selected = true;
      select.appendChild(opt);
    });
    if (!state.currentSongId) noneOpt.selected = true;
    select.onchange = function(){ state.currentSongId = select.value || null; render(); };
    bar.appendChild(label);
    bar.appendChild(select);
    card.appendChild(bar);

    const song = state.songs.find(function(s){ return s.id === state.currentSongId; });

    const sub = document.createElement('p');
    sub.className = 'bs-sub';
    sub.textContent = (song
      ? '"' + song.title + '" 합주에 필요한 인원이 모두 가능한 시간대가 밝게 표시돼요.'
      : '모든 부원의 가능 시간을 겹쳐서 보여줘요. 진할수록 더 많은 인원이 가능해요.')
      + ' 칸에 마우스를 올리거나 짧게 탭하면 가능 인원과 합주 가능한 곡을 볼 수 있어요.';
    card.appendChild(sub);

    const totalMembers = state.members.length;

    const gridWrap = buildGridTable(function(day, hour, td){
      const id = slotId(day, hour);
      const availableMembers = state.members.filter(function(m){
        const arr = state.availability[m.id] || [];
        return arr.indexOf(id) !== -1;
      });
      const slot = document.createElement('div');
      slot.className = 'bs-slot';

      if (song){
        let satisfied = true;
        const perSessionCount = {};
        Object.keys(song.req).forEach(function(sess){
          const cnt = availableMembers.filter(function(m){ return m.session === sess; }).length;
          perSessionCount[sess] = cnt;
          if (cnt < song.req[sess]) satisfied = false;
        });
        if (satisfied){
          slot.style.background = 'var(--amber)';
          slot.style.boxShadow = 'inset 0 0 0 1px rgba(255,255,255,0.4)';
        } else if (availableMembers.length){
          const ratio = Math.min(availableMembers.length / totalMembers, 1);
          slot.style.background = hexToRgba('#e8a33d', 0.12 + ratio * 0.25);
        }
      } else {
        if (availableMembers.length){
          const ratio = availableMembers.length / totalMembers;
          slot.style.background = hexToRgba('#e8a33d', 0.1 + ratio * 0.75);
        }
      }

      // Songs that could be rehearsed with whoever's available in this slot,
      // regardless of which song is picked in the dropdown above.
      const possibleSongs = state.songs.filter(function(sg){
        return Object.keys(sg.req).every(function(sess){
          const cnt = availableMembers.filter(function(m){ return m.session === sess; }).length;
          return cnt >= sg.req[sess];
        });
      });

      slot.addEventListener('mouseenter', function(){
        showPopoverForSlot(slot, day, hour, availableMembers, possibleSongs);
      });
      slot.addEventListener('mouseleave', function(){
        if (popoverCtx.openId !== id) hidePopover();
      });
      slot.addEventListener('click', function(e){
        e.stopPropagation();
        if (popoverCtx.openId === id){
          hidePopover();
        } else {
          showPopoverForSlot(slot, day, hour, availableMembers, possibleSongs);
          popoverCtx.openId = id;
        }
      });

      td.appendChild(slot);
    });
    card.appendChild(gridWrap);

    const legend = document.createElement('div');
    legend.className = 'bs-legend';
    if (song){
      legend.innerHTML =
        '<div class="bs-legend-item"><span class="bs-legend-swatch" style="background:var(--amber)"></span>합주 가능</div>' +
        '<div class="bs-legend-item"><span class="bs-legend-swatch" style="background:' + hexToRgba('#e8a33d',0.3) + '"></span>일부 인원 가능</div>';
    } else {
      legend.innerHTML =
        '<div class="bs-legend-item"><span class="bs-legend-swatch" style="background:' + hexToRgba('#e8a33d',0.85) + '"></span>대부분 가능</div>' +
        '<div class="bs-legend-item"><span class="bs-legend-swatch" style="background:' + hexToRgba('#e8a33d',0.15) + '"></span>일부만 가능</div>';
    }
    card.appendChild(legend);

    wrap.appendChild(card);
    return wrap;
  }

  function buildGridTable(cellRenderer){
    const wrap = document.createElement('div');
    wrap.className = 'bs-grid-wrap';
    const table = document.createElement('table');
    table.className = 'bs-grid';

    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    const cornerTh = document.createElement('th');
    cornerTh.textContent = '';
    headRow.appendChild(cornerTh);
    DAYS.forEach(function(d){
      const th = document.createElement('th');
      th.textContent = d;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    HOURS.forEach(function(hour){
      const tr = document.createElement('tr');
      const hourTd = document.createElement('td');
      hourTd.className = 'bs-hourcell';
      hourTd.textContent = String(hour).padStart(2,'0') + ':00';
      tr.appendChild(hourTd);
      DAYS.forEach(function(day){
        const td = document.createElement('td');
        cellRenderer(day, hour, td);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    return wrap;
  }

  loadAll();
})();
</script>
